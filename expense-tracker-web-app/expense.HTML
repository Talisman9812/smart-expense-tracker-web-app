<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Expense Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
    }

    .card-label {
      color: #cbd5e1;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.45rem;
      font-weight: 800;
    }

    .form-card {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      height: 46px;
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 0 12px;
      margin-bottom: 12px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 1rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary-btn, .secondary-btn, .danger-btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .primary-btn {
      background: #38bdf8;
      color: #082f49;
    }

    .secondary-btn {
      background: #334155;
      color: #f8fafc;
    }

    .danger-btn {
      background: #ef4444;
      color: white;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.1rem;
      margin: 16px 0 10px;
    }

    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .expense-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 14px;
    }

    .expense-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .expense-meta {
      color: #cbd5e1;
      font-size: 0.82rem;
    }

    .expense-amount {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .delete-small {
      margin-top: 8px;
      background: transparent;
      color: #fca5a5;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .empty-state {
      color: #cbd5e1;
      text-align: center;
      padding: 18px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 18px;
    }

    .category-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 16px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.08);
    }

    .category-table th, .category-table td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .category-table th {
      color: #cbd5e1;
      font-size: 0.82rem;
    }

    .toast {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: #16a34a;
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(0,0,0,0.28);
    }

    @media (min-width: 800px) {
      .app {
        max-width: 900px;
      }

      .desktop-layout {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 18px;
        align-items: start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Smart Expense Tracker</h1>
      <p>Track spending, organize by category, and export to spreadsheet.</p>
    </header>

    <section class="summary-grid">
      <div class="card">
        <p class="card-label">Total Spent</p>
        <p class="card-value" id="totalSpent">$0.00</p>
      </div>
      <div class="card">
        <p class="card-label">Transactions</p>
        <p class="card-value" id="transactionCount">0</p>
      </div>
    </section>

    <section class="desktop-layout">
      <div>
        <section class="card form-card">
          <label for="expenseName">Expense Name</label>
          <input id="expenseName" type="text" placeholder="Example: Gas, Food, Rent" />

          <div class="row">
            <div>
              <label for="expenseAmount">Amount</label>
              <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0.00" />
            </div>
            <div>
              <label for="expenseDate">Date</label>
              <input id="expenseDate" type="date" />
            </div>
          </div>

          <label for="expenseCategory">Category</label>
          <select id="expenseCategory">
            <option value="Food">Food</option>
            <option value="Gas">Gas</option>
            <option value="Rent">Rent</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Savings">Savings</option>
            <option value="Other">Other</option>
          </select>

          <button class="primary-btn" onclick="addExpense()">Add Expense</button>
        </section>

        <section class="toolbar">
          <button class="secondary-btn" onclick="exportCSV()">Export CSV</button>
          <button class="danger-btn" onclick="clearAllExpenses()">Clear All</button>
        </section>
      </div>

      <div>
        <label for="categoryFilter">Filter by Category</label>
        <select id="categoryFilter" onchange="renderApp()">
          <option value="All">All Categories</option>
          <option value="Food">Food</option>
          <option value="Gas">Gas</option>
          <option value="Rent">Rent</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Savings">Savings</option>
          <option value="Other">Other</option>
        </select>

        <h2 class="section-title">Recent Expenses</h2>
        <section class="expense-list" id="expenseList"></section>

        <h2 class="section-title">Totals by Category</h2>
        <table class="category-table">
          <thead>
            <tr>
              <th>Category</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="categoryTotals"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Saved</div>

  <script>
    const STORAGE_KEY = "smartExpenseTrackerData";

    let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const expenseName = document.getElementById("expenseName");
    const expenseAmount = document.getElementById("expenseAmount");
    const expenseDate = document.getElementById("expenseDate");
    const expenseCategory = document.getElementById("expenseCategory");
    const categoryFilter = document.getElementById("categoryFilter");
    const expenseList = document.getElementById("expenseList");
    const totalSpent = document.getElementById("totalSpent");
    const transactionCount = document.getElementById("transactionCount");
    const categoryTotals = document.getElementById("categoryTotals");
    const toast = document.getElementById("toast");

    expenseDate.valueAsDate = new Date();

    function formatMoney(amount) {
      return `$${Number(amount).toFixed(2)}`;
    }

    function saveExpenses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.style.display = "block";

      setTimeout(() => {
        toast.style.display = "none";
      }, 1400);
    }

    function addExpense() {
      const name = expenseName.value.trim();
      const amount = Number(expenseAmount.value);
      const date = expenseDate.value;
      const category = expenseCategory.value;

      if (!name || !date || !Number.isFinite(amount) || amount <= 0) {
        showToast("Please enter valid expense info");
        return;
      }

      const expense = {
        id: crypto.randomUUID(),
        name,
        amount,
        category,
        date
      };

      expenses.unshift(expense);
      saveExpenses();
      renderApp();

      expenseName.value = "";
      expenseAmount.value = "";
      expenseDate.valueAsDate = new Date();
      expenseCategory.value = "Food";
      expenseName.focus();

      showToast("Expense added");
    }

    function deleteExpense(id) {
      expenses = expenses.filter(expense => expense.id !== id);
      saveExpenses();
      renderApp();
      showToast("Expense deleted");
    }

    function clearAllExpenses() {
      if (!confirm("Are you sure you want to delete all expenses?")) {
        return;
      }

      expenses = [];
      saveExpenses();
      renderApp();
      showToast("All expenses cleared");
    }

    function getFilteredExpenses() {
      const selectedCategory = categoryFilter.value;

      if (selectedCategory === "All") {
        return expenses;
      }

      return expenses.filter(expense => expense.category === selectedCategory);
    }

    function renderSummary() {
      const total = expenses.reduce((sum, expense) => sum + expense.amount, 0);
      totalSpent.textContent = formatMoney(total);
      transactionCount.textContent = expenses.length;
    }

    function renderExpenses() {
      const filteredExpenses = getFilteredExpenses();

      if (filteredExpenses.length === 0) {
        expenseList.innerHTML = `<div class="empty-state">No expenses found.</div>`;
        return;
      }

      expenseList.innerHTML = filteredExpenses.map(expense => `
        <article class="expense-item">
          <div>
            <p class="expense-name">${expense.name}</p>
            <p class="expense-meta">${expense.category} • ${expense.date}</p>
            <button class="delete-small" onclick="deleteExpense('${expense.id}')">Delete</button>
          </div>
          <p class="expense-amount">${formatMoney(expense.amount)}</p>
        </article>
      `).join("");
    }

    function renderCategoryTotals() {
      const totals = {};

      expenses.forEach(expense => {
        if (!totals[expense.category]) {
          totals[expense.category] = 0;
        }
        totals[expense.category] += expense.amount;
      });

      const rows = Object.entries(totals)
        .sort((a, b) => b[1] - a[1])
        .map(([category, total]) => `
          <tr>
            <td>${category}</td>
            <td>${formatMoney(total)}</td>
          </tr>
        `)
        .join("");

      categoryTotals.innerHTML = rows || `
        <tr>
          <td colspan="2">No category totals yet.</td>
        </tr>
      `;
    }

    function exportCSV() {
      if (expenses.length === 0) {
        showToast("No expenses to export");
        return;
      }

      const header = ["Date", "Name", "Category", "Amount"];
      const rows = expenses.map(expense => [
        expense.date,
        expense.name,
        expense.category,
        expense.amount.toFixed(2)
      ]);

      const csvContent = [header, ...rows]
        .map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(","))
        .join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "expense-tracker-export.csv";
      link.click();

      URL.revokeObjectURL(url);
      showToast("CSV exported");
    }

    function renderApp() {
      renderSummary();
      renderExpenses();
      renderCategoryTotals();
    }

    renderApp();
  </script>
</body>
</html>
